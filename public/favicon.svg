<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Phone body -->
  <rect x="25" y="10" width="50" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Screen -->
  <rect x="30" y="22" width="40" height="56" rx="2" fill="#0f172a"/>
  <!-- Battery icon (red, 1%) -->
  <rect x="36" y="40" width="22" height="12" rx="2" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="38" y="42" width="3" height="8" rx="1" fill="#ef4444"/>
  <rect x="58" y="43" width="2" height="6" rx="1" fill="#ef4444"/>
  <!-- Exclamation mark -->
  <text x="50" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ef4444" text-anchor="middle">!</text>
  <!-- Notch -->
  <rect x="40" y="14" width="20" height="4" rx="2" fill="#0f172a"/>
</svg>
